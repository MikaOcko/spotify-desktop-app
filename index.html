<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <meta
            http-equiv="X-Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
        <title>Spotify Desktop App</title>
    </head>

    <body>
        <div class="container">
            <!-- Sidebar -->
            <div class="left">
                <!-- Navigation menu -->
                <div class="menu">
                    <ul>
                        <li>
                            <a href="#" target="#" rel="noopener noreferrer">
                                <img src="assets/images/home.svg" alt="homepage icon" class="gray-filtered">
                                <span>Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" target="#" rel="noopener noreferrer">
                                <img src="assets/images/search.svg" alt="search icon" class="gray-filtered">
                                <span>Search</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" target="#" rel="noopener noreferrer">
                                <img src="assets/images/library.svg" alt="music library icon" class="gray-filtered">
                                <span>Your library</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" target="#" rel="noopener noreferrer">
                                <img src="assets/images/add.svg" alt="add icon" class="gray-filtered">
                                <span>Create playlist</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" target="#" rel="noopener noreferrer">
                                <img src="assets/images/heart.svg" alt="heart icon" class="gray-filtered">
                                <span>Liked songs</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- Main -->
            <div class="right"></div>
        </div>
        <!-- Scripts -->
        <!-- <script src="main.js" defer></script> -->
    </body>
</html>
